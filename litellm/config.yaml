# Models are managed by the control-plane backend and stored in the DB (store_model_in_db).
model_list: []

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
  store_prompts_in_spend_logs: false
  proxy_batch_write_at: 5
  disable_error_logs: false

litellm_settings:
  drop_params: true
  request_timeout: 600
  num_retries: 1
  json_logs: false
  # realtime sessions: log the events that carry usage so cost lands in the spend logs
  logged_real_time_event_types: ["session.created", "response.create", "response.done"]

router_settings:
  redis_host: os.environ/REDIS_HOST
  redis_port: os.environ/REDIS_PORT

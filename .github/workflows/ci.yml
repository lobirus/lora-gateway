name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt ruff
      - name: Lint (errors only)
        run: ruff check --select E9,F63,F7,F82 backend scripts
      - name: Compile
        run: python -m compileall -q backend/app scripts
      - name: Import app modules
        working-directory: backend
        env:
          GATEWAY_DB_URL: postgresql+psycopg://ci:ci@localhost:5432/ci
          LITELLM_DB_URL: postgresql+psycopg://ci:ci@localhost:5432/ci
          LITELLM_MASTER_KEY: ci-only-placeholder-master-key-000000
          JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-000000
          ENCRYPTION_KEY: ci-only-encryption-key-not-used-anywhere-00
        run: python -c "import app.main; print('backend imports OK')"

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && docker compose config --quiet
